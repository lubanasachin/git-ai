name: Build Multi-Platform Binaries

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: Linux (x86_64)
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: git-ai-linux-x86_64
          - os: macOS (Intel)
            runner: macos-13
            target: x86_64-apple-darwin
            artifact_name: git-ai-macos-x86_64
          - os: macOS (ARM64)
            runner: macos-14
            target: aarch64-apple-darwin
            artifact_name: git-ai-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux cross-compilation tools
        if: matrix.os == 'Linux (x86_64)' && runner.os != 'Linux'
        run: |
          brew install x86_64-linux-gnu-binutils

      - name: Build release binary
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Create artifact directory
        run: mkdir -p artifacts

      - name: Prepare binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/git-ai.exe" "artifacts/${{ matrix.artifact_name }}.exe"
          else
            cp "target/${{ matrix.target }}/release/git-ai" "artifacts/${{ matrix.artifact_name }}"
            chmod +x "artifacts/${{ matrix.artifact_name }}"
          fi

      - name: Generate SHA256 checksum
        shell: bash
        run: |
          cd artifacts
          if [ "${{ runner.os }}" = "Windows" ]; then
            shasum -a 256 "${{ matrix.artifact_name }}.exe" > "${{ matrix.artifact_name }}.exe.sha256"
          else
            shasum -a 256 "${{ matrix.artifact_name }}" > "${{ matrix.artifact_name }}.sha256"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact directory
        run: |
          mkdir -p release_artifacts
          find artifacts -type f -exec cp {} release_artifacts/ \;
          ls -lah release_artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release_artifacts/*
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          generate_release_notes: true
